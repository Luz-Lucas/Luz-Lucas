ily="'Courier New', Courier, monospace" font-size="14" fill="#000">Idiomas ...... português nativo · inglês fluente</text><text x="216" y="283" font-family="'Courier New', Courier, monospace" font-size="14" fill="#000">Status ....... disponível para trabalho</text><text x="216" y="325" font-family="'Courier New', Courier, monospace" font-size="14" fill="#000">Trabalho bem em times ágeis, com revisão de código e</text><text x="216" y="346" font-family="'Courier New', Courier, monospace" font-size="14" fill="#000">pair programming para entregar com qualidade.</text><text x="216" y="388" font-family="'Courier New', Courier, monospace" font-size="14" fill="#000080">Quer a versão completa? Ligue o PC em lucasluz.dev</text><rect class="k" x="216" y="395" width="2" height="17" fill="#000"/><rect x="0" y="490" width="840" height="30" fill="#c0c0c0"/><path d="M0 490.5H840" stroke="#dfdfdf"/><path d="M0 491.5H840" stroke="#fff"/><rect x="3" y="494" width="74" height="23" fill="#c0c0c0"/><path d="M3 516V494H76" stroke="#dfdfdf" transform="translate(.5 .5)" fill="none"/><path d="M3 516H76V494" stroke="#0a0a0a" transform="translate(.5 .5)" fill="none"/><path d="M4 515V495H75" stroke="#fff" transform="translate(.5 .5)" fill="none"/><path d="M4 515H75V495" stroke="#808080" transform="translate(.5 .5)" fill="none"/><svg x="7" y="497" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ffe14d" d="M6 2h4v1H6zM5 3h6v1H5zM4 4h8v5H4zM5 9h6v1H5zM6 10h4v1H6z"/><path fill="#fff" d="M7 3h1v1H7zM6 4h1v3H6z"/><path fill="#e08000" d="M7 6h2v1H7zM7 7h1v3H7zM8 7h1v3H8z"/><path fill="#000" d="M6 1h4v1H6zM5 2h1v1H5zM10 2h1v1h-1zM4 3h1v1H4zM11 3h1v1h-1zM3 4h1v5H3zM12 4h1v5h-1zM4 9h1v1H4zM11 9h1v1h-1zM5 10h1v1H5zM10 10h1v1h-1z"/><path fill="#c0c0c0" d="M5 11h6v1H5zM5 13h6v1H5z"/><path fill="#808080" d="M5 12h6v1H5z"/><path fill="#404040" d="M6 14h4v1H6z"/></svg><text x="27" y="510" font-weight="bold">Iniciar</text><defs><pattern id="dither" width="2" height="2" patte